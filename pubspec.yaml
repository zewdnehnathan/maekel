name: maekel
description: Maekel — Addis Ababa super app shell (Ride, Market, Food, Games).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.0
  intl: any
  material_ui: ^1.11.0
  cupertino_ui: ^1.1.6
  google_fonts: ^9.0.0
  url_launcher: ^6.3.3
  http: ^1.6.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.1.2
  image_picker: ^1.2.4
  http_parser: ^4.1.2
  audioplayers: ^6.8.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  windows:
    generate: true
  image_path: assets/branding/maekel_app_icon.png
  adaptive_icon_background: assets/branding/maekel_app_icon_background.png
  adaptive_icon_foreground: assets/branding/maekel_app_icon_foreground.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
    - assets/games/road_fighter/
