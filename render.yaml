# Demo/QA blueprint: one web service running the full Maekel API stack.
# Pair with Neon Postgres (see docs/deploy-demo-render-neon.md).
services:
  - type: web
    name: maekel-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build -w @maekel/shared
    startCommand: npm run start:demo
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=460"
      - key: PG_POOL_MAX
        value: "2"
      - key: POSTGRES_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL_SEC
        value: "3600"
      - key: MOCK_OTP_CODE
        value: "123456"
      # Comma-separated E.164 phones that bootstrap as platform admins / Market ops.
      - key: ADMIN_PHONES
        value: "+251999999999"
      - key: IDENTITY_URL
        value: http://127.0.0.1:3001
      - key: MARKET_URL
        value: http://127.0.0.1:3002
      - key: FOOD_URL
        value: http://127.0.0.1:3003
      - key: RIDE_URL
        value: http://127.0.0.1:3004
      - key: CHAT_URL
        value: http://127.0.0.1:3005
      - key: GAMES_URL
        value: http://127.0.0.1:3006
      - key: EVENTS_URL
        value: http://127.0.0.1:3007
      - key: MARKET_MAX_ACTIVE_ADS
        value: "5"
      - key: MARKET_PHONE_REVEAL_DAILY_LIMIT
        value: "10"
      - key: PUBLIC_API_BASE
        value: "https://maekel-api.onrender.com"
      # Set these in the Render dashboard from your Neon connection string:
      # POSTGRES_HOST, POSTGRES_PORT, POSTGRES_USER, POSTGRES_PASSWORD
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        value: "5432"
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
